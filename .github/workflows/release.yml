name: Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing stable version tag to release (e.g. v1.2.3)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate requested stable tag and version code
        id: version
        env:
          INPUT_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${INPUT_TAG:-$GITHUB_REF_NAME}"
          python3 - "$TAG" >> "$GITHUB_OUTPUT" <<'PY'
          import re, sys
          tag = sys.argv[1]
          match = re.fullmatch(r"v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)", tag)
          if not match:
              raise SystemExit("Release tag must be vMAJOR.MINOR.PATCH without leading zeroes or prerelease suffixes")
          major, minor, patch = map(int, match.groups())
          if minor > 999 or patch > 999 or major > 2147:
              raise SystemExit("Tag components exceed the monotonic Android versionCode range")
          code = major * 1_000_000 + minor * 1_000 + patch
          if code <= 0 or code > 2_147_483_647:
              raise SystemExit("Tag does not produce a valid positive Android versionCode")
          print(f"tag={tag}")
          print(f"version={major}.{minor}.{patch}")
          print(f"version_code={code}")
          PY
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
            git checkout --detach "refs/tags/$TAG"
          elif [[ "$TAG" != "$GITHUB_REF_NAME" ]]; then
            echo "::error::Push tag does not match the requested version tag"
            exit 1
          fi

      - name: Validate and install persistent signing key
        env:
          LBR_RELEASE_KEYSTORE_BASE64: ${{ secrets.LBR_RELEASE_KEYSTORE_BASE64 }}
          LBR_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.LBR_RELEASE_KEYSTORE_PASSWORD }}
          LBR_RELEASE_KEY_ALIAS: ${{ secrets.LBR_RELEASE_KEY_ALIAS }}
          LBR_RELEASE_KEY_PASSWORD: ${{ secrets.LBR_RELEASE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          for name in LBR_RELEASE_KEYSTORE_BASE64 LBR_RELEASE_KEYSTORE_PASSWORD LBR_RELEASE_KEY_ALIAS LBR_RELEASE_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Required GitHub Actions secret is missing: $name"
              exit 1
            fi
          done
          KEYSTORE="$RUNNER_TEMP/lanbrowserrelay-release.jks"
          if ! printf '%s' "$LBR_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE" || [[ ! -s "$KEYSTORE" ]]; then
            echo "::error::Persistent release keystore is not valid base64 or is empty"
            exit 1
          fi
          chmod 600 "$KEYSTORE"
          if ! keytool -list -keystore "$KEYSTORE" -storepass "$LBR_RELEASE_KEYSTORE_PASSWORD" -alias "$LBR_RELEASE_KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error::Keystore, password, or alias is invalid"
            exit 1
          fi
          {
            printf 'LBR_KEYSTORE_PATH=%s\n' "$KEYSTORE"
            printf 'LBR_KEYSTORE_PASSWORD=%s\n' "$LBR_RELEASE_KEYSTORE_PASSWORD"
            printf 'LBR_KEY_ALIAS=%s\n' "$LBR_RELEASE_KEY_ALIAS"
            printf 'LBR_KEY_PASSWORD=%s\n' "$LBR_RELEASE_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(printf '%s\\n' "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -n 1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Check browser JavaScript and security contracts
        run: |
          node --check app/src/main/assets/web/app.js
          node --check app/src/main/assets/web/link-bridge.js
          node scripts/security-check.js

      - name: Unit tests
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: gradle --no-daemon -PreleaseVersion="$RELEASE_VERSION" test --stacktrace

      - name: Lint
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: gradle --no-daemon -PreleaseVersion="$RELEASE_VERSION" lintRelease --stacktrace

      - name: Assemble signed release APK
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: gradle --no-daemon -PreleaseVersion="$RELEASE_VERSION" assembleRelease --stacktrace

      - name: Verify APK integrity, signature, and version metadata
        id: apk
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
          EXPECTED_VERSION_CODE: ${{ steps.version.outputs.version_code }}
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK" || { echo "Release APK missing or empty"; exit 1; }
          unzip -t "$APK" >/dev/null
          AAPT="$ANDROID_HOME/build-tools/34.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          "$APKSIGNER" verify --verbose "$APK"
          "$AAPT" dump badging "$APK" > "$RUNNER_TEMP/apk-badging.txt"
          python3 - "$RUNNER_TEMP/apk-badging.txt" "$EXPECTED_VERSION" "$EXPECTED_VERSION_CODE" <<'PY'
          import re, sys
          text = open(sys.argv[1], encoding="utf-8").read()
          match = re.search(r"package:.*?versionCode='([0-9]+)'.*?versionName='([^']+)'", text)
          if not match:
              raise SystemExit("Could not read APK version metadata")
          actual_code, actual_name = match.groups()
          if actual_code != sys.argv[3] or actual_name != sys.argv[2]:
              raise SystemExit(f"APK version mismatch: got {actual_name}/{actual_code}, expected {sys.argv[2]}/{sys.argv[3]}")
          print(f"Verified APK metadata: version={actual_name} versionCode={actual_code}")
          PY
          SIGNATURE="$("$APKSIGNER" verify --print-certs "$APK" 2>&1)"
          printf '%s\n' "$SIGNATURE" | grep -E 'Signer #1 certificate DN|Signer #1 certificate SHA-256 digest' > "$RUNNER_TEMP/signature.txt"
          SHA="$(sha256sum "$APK" | cut -d' ' -f1)"
          SIZE="$(stat -c%s "$APK")"
          echo "SHA256=$SHA; SIZE=$SIZE"
          echo "apk_size=$SIZE" >> "$GITHUB_OUTPUT"
          echo "apk_sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "signer=$(tr '\n' ';' < "$RUNNER_TEMP/signature.txt")" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          APK_SHA256: ${{ steps.apk.outputs.apk_sha256 }}
          APK_SIZE: ${{ steps.apk.outputs.apk_size }}
          SIGNER: ${{ steps.apk.outputs.signer }}
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          NOTES=$(cat <<EOF
          ## LAN Browser Relay $RELEASE_VERSION

          Android TV LAN browser and Ethernet download relay.

          **App version:** $RELEASE_VERSION (versionCode ${{ steps.version.outputs.version_code }})
          **APK file size:** $(numfmt --to=iec "$APK_SIZE") bytes ($APK_SIZE)
          **SHA-256:** \`$APK_SHA256\`
          **Signing certificate:** $SIGNER
          **Signing:** Persistent production keystore supplied from GitHub Actions secrets.
          **API level:** minSdk 24 (Android 7.0+), targetSdk 34

          ### Install
          \`\`\`bash
          adb connect <tv-ip>
          adb install -r LANBrowserRelay-$RELEASE_VERSION.apk
          \`\`\`
          Open the app, then open the shown \`http://<tv-ip>:8080\` URL on your phone.

          ### Notes
          - Hard 100,000,000-byte download cap, enforced against actual streamed bytes.
          - Downloads are streamed through bounded buffers with no permanent TV storage.
          - Proxied HTML is isolated on a distinct port and the control plane is session/CSRF protected.
          EOF
          )
          gh release create "$RELEASE_TAG" \
            "$APK#LANBrowserRelay-$RELEASE_VERSION.apk" \
            --title "LAN Browser Relay $RELEASE_VERSION" \
            --notes "$NOTES"
