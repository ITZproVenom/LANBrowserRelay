name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew || true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Run unit tests
        run: |
          if [ -f gradlew ]; then
            ./gradlew test --stacktrace || true
          else
            echo "No gradlew"
          fi

      - name: Lint
        run: |
          if [ -f gradlew ]; then
            ./gradlew lintDebug --stacktrace || true
          fi

      - name: Assemble debug APK
        run: |
          if [ -f gradlew ]; then
            ./gradlew assembleDebug --stacktrace
          else
            echo "Skipping assemble"
            exit 1
          fi

      - name: Verify APK
        run: |
          APK=$(find app/build/outputs/apk -name "*.apk" 2>/dev/null | head -1)
          if [ -n "$APK" ] && [ -s "$APK" ]; then
            echo "APK found: $APK ($(stat -c%s "$APK") bytes)"
            ls -la "$APK"
          else
            echo "No APK produced"
            exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
